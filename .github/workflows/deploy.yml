name: Deploy

# Builds the site and deploys it to Cloudflare Workers, then runs Playwright
# against what was deployed.
#
# - Pull requests: the production D1 database is copied into
#   eligundry-pr-<number> on every push, the build runs against that copy, and
#   the Worker version is uploaded as a preview at
#   https://pr-<number>-eligundry.<subdomain>.workers.dev bound to it. The
#   copy is deleted when the pull request closes.
# - main, and workflow_dispatch (Daylio uploads and the nightly cron dispatch
#   it through GITHUB_DEPLOY_TOKEN): build against production and deploy.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is running
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Build and deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.preview.outputs.url || 'https://eligundry.eligundry.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # src/lib/lastModified.ts reads each file's git history for the
          # sitemap, so a shallow clone would date every page today
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/astro-fontaine
            src/assets/images/notion
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-

      - name: Copy the production database for this pull request
        id: fork
        if: github.event_name == 'pull_request'
        run: |
          id=$(scripts/cloudflare/fork-d1.sh "eligundry-pr-${{ github.event.pull_request.number }}")
          echo "database_id=$id" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          D1_DATABASE_ID: ${{ steps.fork.outputs.database_id }}
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LINKS_DATABASE_ID: ${{ secrets.NOTION_LINKS_DATABASE_ID }}
          # Only production builds publish to standard.site
          BLUESKY_USERNAME: ${{ github.event_name != 'pull_request' && secrets.BLUESKY_USERNAME || '' }}
          BLUESKY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.BLUESKY_PASSWORD || '' }}
          STANDARD_SITE_DID: ${{ secrets.STANDARD_SITE_DID }}
          STANDARD_SITE_PUBLICATION_RKEY: ${{ secrets.STANDARD_SITE_PUBLICATION_RKEY }}
        run: pnpm build

      - name: Upload a preview version
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          node scripts/cloudflare/preview-config.mjs "${{ steps.fork.outputs.database_id }}"
          alias="pr-${{ github.event.pull_request.number }}"
          pnpm exec wrangler versions upload \
            --config dist/server/wrangler.preview.json \
            --preview-alias "$alias" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -o "https://$alias-[^ ]*workers.dev" upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        env:
          MESSAGE: ${{ inputs.reason || github.event.head_commit.message || 'Deploy' }}
        run: |
          pnpm exec wrangler deploy --config dist/server/wrangler.json \
            --message "${MESSAGE:0:100}"

  e2e:
    name: Playwright
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Chromium for most specs; Google Chrome for the resume's WebMCP tools
        run: pnpm exec playwright install --with-deps chromium chrome

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cleanup:
    name: Delete the pull request's database copy
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
      - name: Delete eligundry-pr-${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler d1 delete "eligundry-pr-${{ github.event.pull_request.number }}" --skip-confirmation || true
