name: Playwright

# Workers Builds deploys the site (scripts/cloudflare/), and its deploy
# scripts record each deploy as a GitHub deployment. This runs Playwright
# against whatever was deployed.
on: deployment_status

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Chromium for most specs; Google Chrome for the resume's WebMCP tools
        run: pnpm exec playwright install --with-deps chromium chrome

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
