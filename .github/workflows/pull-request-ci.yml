name: Pull Request CI
on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        id: dependencies
        run: |
          pnpm --version
          pnpm install

      - name: Run linters
        if: steps.dependencies.conclusion == 'success' && !cancelled()
        run: pnpm run lint

      - name: Astro check
        if: steps.dependencies.conclusion == 'success' && !cancelled()
        # Syncing content collections reads D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LINKS_DATABASE_ID: ${{ secrets.NOTION_LINKS_DATABASE_ID }}
        run: pnpm run astro-check
