name: Pull Request CI
on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        id: dependencies
        run: |
          pnpm --version
          pnpm install

      - name: Run linters
        if: steps.dependencies.conclusion == 'success' && !cancelled()
        run: pnpm run lint

      - name: Astro check
        if: steps.dependencies.conclusion == 'success' && !cancelled()
        # Syncing content collections reads D1; the script decrypts
        # .env.secrets with this key
        env:
          DOTENV_PRIVATE_KEY_SECRETS: ${{ secrets.DOTENV_PRIVATE_KEY_SECRETS }}
        run: pnpm run astro-check
