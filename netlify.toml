[build]
command = 'npm run build'
publish = 'dist'

[build.environment]
NODE_VERSION = '26'

[dev]
command = "astro dev"
port = 8000

[[plugins]]
package = 'netlify-plugin-cache'
[plugins.inputs]
paths = ['.cache', 'public/astro-fontaine', 'src/assets/images/notion']

[[headers]]
for = "/*.rss"
[headers.values]
Content-Type = "application/xml; charset=utf-8"
x-content-type-options = "nosniff"

# Generated OpenGraph images (src/pages/og). They're prerendered files, so the
# endpoint's own response headers never reach the CDN. Their URLs don't change
# when a post's title does, so cache for a day rather than forever.
[[headers]]
for = "/og/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[functions."lastfm-weekly"]
# Every Friday at 12pm eastern (give or take an hour)
schedule = '00 17 * * 5'

[functions."lastfm-monthly"]
# First day of the month at 12pm eastern (give or take an hour)
schedule = '00 17 1 * *'

[functions."lastfm-yearly"]
# New Years day at reasonable hour
schedule = '00 17 1 1 *'

[functions."nightly-rebuild"]
# Every night at 11pm eastern (give or take an hour for DST)
schedule = '00 04 * * *'
